name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/lasli-release-key.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=lasli-release-key.jks\n'
          } > android/key.properties

      - name: Build Android release
        run: flutter build apk --release

      - name: Name Android package
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "LASLI-${version}-Android.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: LASLI-android-release
          path: LASLI-*-Android.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Install iOS pods
        run: pod install
        working-directory: ios

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/ipa/Payload \
            "build/ios/ipa/LASLI-${version}-iOS-unsigned.ipa"

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: LASLI-ios-unsigned-ipa
          path: build/ios/ipa/LASLI-*-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/LASLI-*-Android.apk
            release-assets/LASLI-*-iOS-unsigned.ipa
